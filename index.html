<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaamKhoj - Everyday Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#10243a;color:white;text-align:center;padding:24px 12px}
main{max-width:650px;margin:auto;padding:16px}
.box{background:white;padding:18px;margin:18px 0;border-radius:14px;box-shadow:0 3px 12px #0001}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd5e3;border-radius:8px;font-size:16px}
button,.download{display:inline-block;background:#087f8c;color:white;border:0;padding:12px 16px;border-radius:8px;font-size:16px;text-decoration:none;cursor:pointer}
img{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:12px auto}
.result{font-weight:bold;color:#087f8c;overflow-wrap:anywhere}
.small{color:#64748b;font-size:14px}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>🔎 KaamKhoj</h1>
<p>Kaam Batao. Solution Pao.</p>
</header>
<main>
<div class="box">
<h2>🖼️ Image Compressor</h2>
<p class="small">Photo choose karo aur uska size kam karo.</p>
<label for="photo">Apni photo select karo</label>
<input type="file" id="photo" accept="image/*">
<img id="preview" alt="Photo preview" hidden>
<label for="quality">Image quality: <span id="qvalue">70%</span></label>
<input type="range" id="quality" min="10" max="95" value="70">
<button id="compress">Compress Image</button>
<p id="imageResult" class="result"></p>
<a id="download" class="download" hidden download="kaamkhoj-compressed.jpg">Download Compressed Photo</a>
<p class="small">Photo browser mein process hoti hai; upload server par nahi hoti.</p>
</div>

<div class="box">
<h2>🧮 Percentage Calculator</h2>
<label for="marks">Obtained Marks</label>
<input type="number" id="marks" min="0" placeholder="Jaise 375">
<label for="total">Total Marks</label>
<input type="number" id="total" min="1" placeholder="Jaise 500">
<button id="calculate">Calculate Percentage</button>
<p id="answer" class="result"></p>
</div>

<div class="box">
<h2>📄 Resume Maker</h2>
<p>Coming soon!</p>
</div>
<div class="box">
<h2>📁 PDF Tools</h2>
<p>Coming soon!</p>
</div>
</main>
<footer>KaamKhoj © 2026</footer>

<script>
const photo=document.getElementById("photo");
const preview=document.getElementById("preview");
const quality=document.getElementById("quality");
const qvalue=document.getElementById("qvalue");
const imageResult=document.getElementById("imageResult");
const download=document.getElementById("download");
let image=null,originalURL=null,compressedURL=null;

function sizeText(bytes){
 if(bytes<1024)return bytes+" B";
 if(bytes<1048576)return (bytes/1024).toFixed(1)+" KB";
 return (bytes/1048576).toFixed(2)+" MB";
}

photo.addEventListener("change",()=>{
 image=null;
 imageResult.textContent="";
 download.hidden=true;
 if(originalURL)URL.revokeObjectURL(originalURL);
 if(compressedURL)URL.revokeObjectURL(compressedURL);
 originalURL=null;compressedURL=null;
 const file=photo.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){
 imageResult.textContent="Please select a valid image.";
 photo.value="";return;
 }
 originalURL=URL.createObjectURL(file);
 const img=new Image();
 img.onload=()=>{
 image=img;
 preview.src=originalURL;
 preview.hidden=false;
 imageResult.textContent="Original size: "+sizeText(file.size);
 };
 img.onerror=()=>imageResult.textContent="Image open nahi hui. Doosri photo try karo.";
 img.src=originalURL;
});

quality.addEventListener("input",()=>{
 qvalue.textContent=quality.value+"%";
});

document.getElementById("compress").addEventListener("click",()=>{
 if(!image){
 imageResult.textContent="Pehle photo select karo.";
 return;
 }
 const canvas=document.createElement("canvas");
 canvas.width=image.naturalWidth;
 canvas.height=image.naturalHeight;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#ffffff";
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.drawImage(image,0,0);
 canvas.toBlob(blob=>{
 if(!blob){
 imageResult.textContent="Compression failed. Doosri photo try karo.";
 return;
 }
 if(compressedURL)URL.revokeObjectURL(compressedURL);
 compressedURL=URL.createObjectURL(blob);
 const oldSize=photo.files[0].size;
 const newSize=blob.size;
 const diff=((oldSize-newSize)/oldSize)*100;
 imageResult.textContent="Original: "+sizeText(oldSize)+
 " | New: "+sizeText(newSize)+
 (diff>=0?" | Size reduced by "+diff.toFixed(1)+"%":
 " | New file is "+Math.abs(diff).toFixed(1)+"% larger");
 download.href=compressedURL;
 download.hidden=false;
 },"image/jpeg",Number(quality.value)/100);
});

document.getElementById("calculate").addEventListener("click",()=>{
 const m=document.getElementById("marks").value;
 const t=document.getElementById("total").value;
 const answer=document.getElementById("answer");
 const marks=Number(m),total=Number(t);
 if(m===""||t===""||total<=0||marks<0||marks>total){
 answer.textContent="Sahi marks aur total marks bharo.";
 return;
 }
 answer.textContent="Your Percentage: "+(marks/total*100).toFixed(2)+"%";
});
</script>
</body>
</html>
